<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1f33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bosses">
  <title>the BO$$ES of Our World</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/rye-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1 id="title" aria-label="the Bosses of Our World"><span class="the">the</span><span class="main">BO$$ES</span><span class="of">of</span><span class="main">OUR WORLD</span></h1>
    <header id="hud">
      <div class="row">
        <div id="level-box">판 <span id="level">1</span></div>
        <div id="score-box"><span id="score">0</span> <span class="sep">/</span> <span id="target">0</span></div>
      </div>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="sub-row">
        <button id="mute" type="button" aria-label="소리 켜기/끄기">🔊</button>
        <div id="best-box">최고 판 <span id="best">1</span></div>
      </div>
    </header>
    <main id="stage">
      <canvas id="game"></canvas>
      <div id="banner" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
