<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1f33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bosses">
  <title>Bosses of Our World</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/rye-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="top">
      <h1 id="title" class="top-slot show" aria-label="the Bosses of Our World"><span class="the">the</span><span class="main">BO</span><span class="usd">$</span><span class="usd">$</span><span class="main">ES</span><span class="of">of</span><span class="main">OUR WORLD</span></h1>
      <div id="ad" class="top-slot" aria-hidden="true"><span class="ad-chip">AD</span><span id="ad-text"></span></div>
    </div>
    <header id="hud">
      <div class="row">
        <div id="level-box">판 <span id="level">1</span> <span id="timer" title="지금 깨면 받는 타임 보너스 (시간이 지날수록 줄어듦)"></span></div>
        <div id="score-box"><span id="score">0</span> <span class="sep">/</span> <span id="target">0</span></div>
      </div>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="sub-row">
        <div class="btns">
          <button id="mute" type="button" aria-label="소리 켜기/끄기">Sound <b class="on">O</b></button>
          <button id="restart" type="button" aria-label="1판부터 다시">↺ 처음부터</button>
        </div>
        <div id="total-box">총점 <span id="total">0</span></div>
        <div id="best-box"><div>하이스코어 <span id="high">0</span></div><div>최고 판 <span id="best">1</span></div></div>
      </div>
    </header>
    <main id="stage">
      <canvas id="game"></canvas>
      <div id="banner" aria-live="polite"></div>
    </main>
  </div>
  <div id="sound-ask" role="dialog" aria-modal="true" aria-labelledby="sound-ask-q" style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(10,12,26,.72)">
    <div class="box">
      <div class="icon">🔊</div>
      <p id="sound-ask-q">게임 소리를 켤까요?</p>
      <div class="btns">
        <button type="button" data-sound="on">소리 켜기</button>
        <button type="button" data-sound="off">소리 없이</button>
      </div>
      <small>왼쪽 위 Sound 버튼으로 언제든 바꿀 수 있어요</small>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
